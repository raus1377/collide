services:
  - type: web
    name: collide
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: QLOO_API_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_MAX_CALLS
        value: "60"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
